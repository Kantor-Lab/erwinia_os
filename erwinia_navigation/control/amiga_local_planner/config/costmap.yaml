local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: !!float 12
      height: !!float 12
      resolution: 0.1
      always_send_full_costmap: true

      # Robot footprint (Amiga: axle at x=±0.61m, outer frame at y=±0.82m)
      footprint: "[[-0.65, -0.82], [-0.65, 0.82], [0.65, 0.82], [0.65, -0.82]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: !!int 16
        max_obstacle_height: 1.5
        mark_threshold: !!int 1
        observation_sources: velodyne
        velodyne:
          topic: /velodyne_points
          data_type: PointCloud2
          sensor_frame: velodyne
          min_obstacle_height: 0.1
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          raytrace_max_range: 8.0
          obstacle_max_range: 7.0
          raytrace_min_range: 0.1
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.3
        cost_scaling_factor: 1.5
