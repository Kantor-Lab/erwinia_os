local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: amiga/base_footprint
      rolling_window: true
      transform_tolerance: 0.5
      width: !!float 100
      height: !!float 100
      resolution: 0.1
      always_send_full_costmap: true

      # Robot footprint (Amiga: axle at x=±0.61m, outer frame at y=±0.82m)
      footprint: "[[-0.65, -0.82], [-0.65, 0.82], [0.65, 0.82], [0.65, -0.82]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: !!int 20
        max_obstacle_height: 2.0
        mark_threshold: !!int 2
        observation_sources: velodyne_marking velodyne_clearing

        # Marking source — only marks obstacles above ground level
        velodyne_marking:
          topic: /velodyne_points
          data_type: PointCloud2
          sensor_frame: velodyne
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          obstacle_max_range: 45.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0

        # Clearing source — includes ground returns so rays clear stale voxels
        velodyne_clearing:
          topic: /velodyne_points
          data_type: PointCloud2
          sensor_frame: velodyne
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: true
          marking: false
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          observation_persistence: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.3
        cost_scaling_factor: 1.5
