controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Rollout parameters
      time_steps: 80          # horizon = 80 * 0.05 = 4.0 s  (longer lookahead)
      model_dt: 0.05
      batch_size: 4000        # more samples → better obstacle avoidance
      iteration_count: 2      # extra refinement pass

      # Noise std (exploration)
      vx_std: 0.2
      wz_std: 0.3             # reduced to dampen path-following oscillation
      vy_std: 0.0

      # Velocity limits (Amiga skid-steer)
      vx_max:  0.3
      vx_min: -0.1
      vy_max:  0.0
      wz_max:  1.2

      # MPPI temperature / cost shaping
      temperature: 0.2
      gamma: 0.015

      motion_model: "DiffDrive"
      visualize: true         # publish /trajectories for RViz debugging
      prune_distance: 1.5
      transform_tolerance: 2.0

      critics:
        ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
         "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
         "PathAngleCritic", "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # ObstaclesCritic: uses inflation-layer geometry to build a repulsion
      # field — the further from obstacles, the lower the cost.
      # inflation_radius / cost_scaling_factor MUST match costmap.yaml values.
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 50.0
        critical_weight: 100.0
        consider_footprint: true    # check full footprint; detects obstacles 0.82m earlier than center-point
        collision_cost: 1000.0
        collision_margin_distance: 0.15
        near_goal_distance: 1.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 500.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 500.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 2
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 2
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.7
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
